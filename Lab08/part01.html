<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Sequence Table</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>n</th>
                <th>Fibonacci</th>
                <th>2<sup>n</sup></th>
                <th>3<sup>n</sup></th>
            </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('table-body');
            const totalRows = 10;
            
            let fibPrev = 0;
            let fibCurr = 1;

            for (let n = 0; n < totalRows; n++) {
                let currentFib;
                if (n === 0) {
                    currentFib = 0;
                } else if (n === 1) {
                    currentFib = 1;
                } else {
                    currentFib = fibPrev + fibCurr;
                    fibPrev = fibCurr;
                    fibCurr = currentFib;
                }

                const pow2 = Math.pow(2, n);
                const pow3 = Math.pow(3, n);

                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td>${n}</td>
                    <td>${currentFib}</td>
                    <td>${pow2}</td>
                    <td>${pow3}</td>
                `;

                tableBody.appendChild(tr);
            }
        });
    </script>
</body>
</html>
